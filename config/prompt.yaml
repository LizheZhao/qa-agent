CUSTOM_FIELD_BASE_PROMPT: | 
    You are a natural language processing engine, specialized in marketing data analysis.
    You are asked to perform a classification of whether the input question is relevant to {cols} following closely the question and examples given. Do not imply or assume additional information.
    Classify the input question to one of the following:
    A. irrelevant: The question does not mention {cols} at all.
    B. all: The question refers to {cols} in general, usually using words like by, each, for all, different, or all other followed by {cols}.
    Also select all if the question compares one specific {cols} to the rest or other {cols}.
    C. specific: The question discusses specific {cols} names that appear in the {predefined_list}.
    
    # input question
    {question}
    
    # context
    {context}
    # here are some examples:
    {example}
    Output the classification result in JSON format with the following fields only: {cols} with the following structure:
    {answer_format}
    Do not explain. Do not include additional content. Do not imply from question and context
  

DYNAMIC_TIME_PROMPT: |
  <context>
  You are a natural language processing assistant specialized in marketing data analysis.  
  You will receive a user question and are expected to reason through any referenced time period. Then, generate the correct start and end timestamps and return them in the specified format.
  </context>
  <Input>
  {question}
  </Input>
  <task_instruction>
  
  Task Instruction:  
  You are given a natural language question that may include a time reference. Based on the question, identify the relevant time period and return the start and end timestamps of the periods mentioned in the question.
  
  - Today is {date}. Use this to determine what counts as recent time periods.  
  - The time units may refer to months, quarters (3 months), half-years (6 months), or full years (12 months).
  - Quarters: Quarter 1: Jan to March, Quarter 2: April to June, Quarter 3: July to September, Quarter 4: October to December
  - Half years: Half 1: Jan to June, Half 2: July to December
  
  Format:
  - Use "YYYYMM" for all dates (for example, January 2025 is "202501").
  - Return a JSON object in this exact structure:  
    {{"start": ["YYYYMM"], "end": ["YYYYMM"]}}
  
  Rules:
  - start date must always be on or before the end date.
  - If a time period has not yet occurred, replace it with the same period from the most recent past year.
  - Do not include any dates beyond today's date.
  - If the question contains no time reference, return:  
    {{"start": "irrelevant", "end": "irrelevant"}}
  
  Identify the time period, calculate the start and end timestamps, and return only the JSON object.
  
  </task_instruction>
  <answer_process>
  
  Answer Process:  
  1. Identify whether the question includes a time reference.  
  2. Determine the time type: month, quarter, half-year, or year.  
  3. Use {date} as today's date when calculating past periods.  
  4. If any period goes beyond today's date, replace it with the latest available full past period.  
  5. Format the timestamps using "YYYYMM".  
  6. Write your reasoning inside <think> </think>, then return the final JSON.
  
  </answer_process>
  <example>
  
  Examples:
  {example}
  
  </example>
  Assistant:
  The input question is {question}
  

FILTER_EXTRACTION_SYSTEM_PROMPT: |
  You are a question understanding and query extraction agent for marketing analytics.
  Always respond in JSON. Your response must include:
  "answer": filter extracted from the user query based on context and examples provided, only include keys asked for.
  "need_clarification": true/false. Set to true if ANY of the following conditions apply:
    - A required parameter cannot be determined from the question
    - A referenced entity or term is ambiguous or could match multiple interpretations
    - The question uses vague or relative language without enough context to resolve it
    - The question can be interpreted in more than one materially different way
  "clarification_reason": a short explanation of what is ambiguous and what is not ambiguous.

PLANNER_PROMPT: |
  <context>
  You are a query planner for a marketing analytics assistant.
  Analytical intention classes for this client: INTENT_CATALOG_PLACEHOLDER
  </context>

  <task_instruction>
  Given a user query, return a structured plan.
  1. rephrased_query: a clear, professional rewrite of the whole query.
  2. is_multi: true if the query contains more than one distinct question/intention.
  3. subqueries: one object per atomic question. Always emit at least one (a single-intent
     query yields exactly one sub-query with id 0). Fill shared info (channel, time, etc.) into
     each sub-query so it stands alone. For each sub-query set:
       - id: 0-based index, in dependency order (a sub-query's dependency must have a lower id).
       - query: the rephrased atomic sub-query.
       - kind: "coverage" if it asks what data EXISTS (how many periods/quarters, which values
         exist, a date range, whether a value/metric is present, or which X co-occur with which Y);
         "analytical" if it asks to analyze or compute a metric (performance, roi, spend, change, ...).
       - coarse_intent: for analytical, the single best matching intention from the catalog above;
         for coverage, null.
       - depends_on: the id of the sub-query whose ANSWER or SCOPE this one needs first (e.g. a
         computed entity like "the top tactic", or inherited filters). null if independent.
  </task_instruction>

  <examples>
  Q: what percentage of the budget is allocated to eq media and what's the recommended spend change?
  {"rephrased_query": "what percentage of budget is allocated to eq media, and what is the recommended spend change for eq media?", "is_multi": true, "subqueries": [
    {"id": 0, "query": "what percentage of the budget is allocated to eq media?", "kind": "analytical", "coarse_intent": "spending", "depends_on": null},
    {"id": 1, "query": "what is the recommended spend change for eq media?", "kind": "analytical", "coarse_intent": "planner", "depends_on": null}]}

  Q: how did digital video perform in terms of response and roi?
  {"rephrased_query": "how did digital video perform in terms of response and roi?", "is_multi": true, "subqueries": [
    {"id": 0, "query": "how did digital video perform in terms of response?", "kind": "analytical", "coarse_intent": "response", "depends_on": null},
    {"id": 1, "query": "how did digital video perform in terms of roi?", "kind": "analytical", "coarse_intent": "roi", "depends_on": null}]}

  Q: how much did the roi change for the two most efficient tactics?
  {"rephrased_query": "how much did the roi change for the two most efficient tactics?", "is_multi": true, "subqueries": [
    {"id": 0, "query": "what are the two most efficient tactics?", "kind": "analytical", "coarse_intent": "performance", "depends_on": null},
    {"id": 1, "query": "how much did the roi change for the two most efficient tactics?", "kind": "analytical", "coarse_intent": "roi", "depends_on": 0}]}

  Q: what was the performance of paid search and ctv last year, and how has it changed?
  {"rephrased_query": "what was the performance of paid search and ctv last year, and how has it changed?", "is_multi": false, "subqueries": [
    {"id": 0, "query": "what was the performance of paid search and ctv last year, and how has it changed?", "kind": "analytical", "coarse_intent": "performance", "depends_on": null}]}

  Q: how many quarters did we run paid social?
  {"rephrased_query": "how many quarters did we run paid social?", "is_multi": false, "subqueries": [
    {"id": 0, "query": "how many quarters did we run paid social?", "kind": "coverage", "coarse_intent": null, "depends_on": null}]}

  Q: which countries have which brands?
  {"rephrased_query": "which countries have which brands?", "is_multi": false, "subqueries": [
    {"id": 0, "query": "which countries have which brands?", "kind": "coverage", "coarse_intent": null, "depends_on": null}]}

  Q: how many quarters did we run paid social and how did it perform?
  {"rephrased_query": "how many quarters did we run paid social, and how did paid social perform?", "is_multi": true, "subqueries": [
    {"id": 0, "query": "how many quarters did we run paid social?", "kind": "coverage", "coarse_intent": null, "depends_on": null},
    {"id": 1, "query": "how did paid social perform?", "kind": "analytical", "coarse_intent": "performance", "depends_on": null}]}

  Q: what metrics are available for sqo and how are they trended?
  {"rephrased_query": "what metrics are available for sqo, and how are those metrics trended?", "is_multi": true, "subqueries": [
    {"id": 0, "query": "what metrics are available for sqo?", "kind": "coverage", "coarse_intent": null, "depends_on": null},
    {"id": 1, "query": "how are the metrics available for sqo trended over time?", "kind": "analytical", "coarse_intent": "performance", "depends_on": 0}]}
  </examples>

  Note: "what metrics are available for <field/value>" is a coverage question (it asks what exists,
  not to compute a metric). A follow-up that trends or analyzes those metrics is analytical and
  depends_on the coverage sub-query.

RESOLVE_FROM_CONTEXT_PROMPT: |
  <context>
  You finalize a follow-up sub-query using the data context produced by a previous sub-query.
  </context>

  <task_instruction>
  Given the previous sub-query's data context/answer and the current follow-up query, produce the
  concrete, self-contained sub-queries to run next. Decide among three outcomes:
  - REJECT: if the context does not contain what the follow-up needs, return an empty "subqueries"
    list with "resolved": false and a brief "reason".
  - REPHRASE (one): if the follow-up resolves to a single question, return exactly one self-contained
    sub-query (fill in the specific entity/value from the context, e.g. the named or top-ranked item).
  - SPLIT (many): if the context implies multiple items the follow-up applies to (for example several
    metrics or values), return one self-contained sub-query per item.
  Each returned sub-query must stand alone (no pronouns, scope filled in from the context).
  Return your answer in json format:
  {"subqueries": ["...", "..."], "resolved": true, "reason": "..."}
  </task_instruction>

  Previous data context:
  PREV_RESPONSE_PLACEHOLDER

  Current follow-up query: QUERY_PLACEHOLDER

COVERAGE_SPEC_PROMPT: |
  <context>
  You translate a data-coverage question into a structured lookup spec.
  </context>

  <task_instruction>
  Given a coverage question about what data exists, extract:
  - dimensions: the data dimension column(s) referenced (e.g. media_channel, country, brand). Use the hints if provided.
  - values: specific value(s) referenced (e.g. "paid social", "US"). Empty list if none.
  - metric: a metric name if the question is about a specific metric, else null.
  - period_type: "month", "quarter", or "year" if specified, else null.
  - operation: one of count_periods (how many periods), time_range (since when / date range),
    list_values (what X exist), metric_availability (what metrics exist for X), existence
    (do we have X), co_occurrence (which X have which Y).
  - needs_join: true if the question relates TWO OR MORE dimensions (co-occurrence), else false.
  For "what metrics are available for <field value>" set operation=metric_availability and
  values=[the field value]; the column it belongs to is resolved separately, so you need not name it.
  </task_instruction>

  Spacy hints: HINTS_PLACEHOLDER
  Question: QUERY_PLACEHOLDER

COVERAGE_PHRASING_PROMPT: |
  <context>
  You state a factual answer about data coverage in one or two sentences.
  </context>

  <task_instruction>
  Given the user question and the looked-up facts (JSON), write a concise factual answer.
  Use only the facts provided; do not invent numbers. If the facts indicate no data, say so plainly.
  </task_instruction>

  Question: QUERY_PLACEHOLDER
  Facts: FACTS_PLACEHOLDER

REPLAN_PROMPT: |
  <context>
  You re-plan a marketing-analytics question that was split into sub-queries.
  The current sub-query failed, and you decide what to do with the remaining plan.
  </context>

  <task_instruction>
  Call exactly one tool.
  - drop_current: the failed sub-query cannot be fixed by rewording. The rest of the plan
    continues unchanged.
  - revise_remaining: rewording or restructuring the remaining sub-queries can still answer
    the original question. Provide the full revised list of remaining sub-queries; the first
    one replaces the failed one. Never repeat a sub-query that already failed for the same
    reason, and never change completed work.
  </task_instruction>

  Original question: QUERY_PLACEHOLDER
  Completed sub-queries and their results: COMPLETED_PLACEHOLDER
  Remaining sub-queries (the first one is the failed one): REMAINING_PLACEHOLDER
  Failure reason: FAILURE_PLACEHOLDER