[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentic-orchestration"
version = "0.9.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "enterprise-llm",
  "fastapi>=0.116,<1",
  "jsonschema>=4.25,<5",
  "orchestration-core",
  "orchestration-tools",
  "pydantic-settings>=2.10,<3",
  "pymongo>=4.11,<5",
  "pyyaml>=6.0,<7",
  "marketing-science-agent",
  "router-agent",
  "ask-genome-agent",
  "uvicorn[standard]>=0.35,<1",
]

[tool.uv.sources]
enterprise-llm = { workspace = true }
orchestration-core = { workspace = true }
orchestration-tools = { workspace = true }
marketing-science-agent = { workspace = true }
router-agent = { workspace = true }
ask-genome-agent = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_orchestration", "src/integrations"]

[tool.uv.workspace]
members = [
  "packages/agents/marketing-science",
  "packages/agents/router",
  "packages/agents/ask-genome",
  "packages/orchestration-core",
  "packages/enterprise-llm",
  "packages/tools",
]

[dependency-groups]
# The image builds workspace wheels with --no-build-isolation, so the build backend
# must come from the lockfile like everything else. Without this it is fetched from
# the network unhashed at build time and the image is not reproducible.
build = [
  "hatchling>=1.27,<2",
]
dev = [
  "mypy>=1.17,<2",
  # Must match the pandas major version ask-genome pins.
  "pandas-stubs>=2.3,<3",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<0.14",
  "types-jsonschema>=4.25,<5",
  "types-pyyaml>=6.0,<7",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# Vendored upstream code, regenerated by scripts/sync_ask_genome_core.py; its style is upstream's.
extend-exclude = ["packages/agents/ask-genome/src/ask_genome_agent/vendor/ask_genome_core"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"packages/agents/_template/**/*.py" = ["F821"]
"packages/agents/ask-genome/src/ask_genome_agent/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
# Vendored upstream code; see the ask_genome_core override below.
exclude = ["ask_genome_agent/vendor/ask_genome_core/"]
packages = [
  "agentic_orchestration",
  "integrations",
  "orchestration_core",
  "enterprise_llm",
  "orchestration_tools",
  "marketing_science_agent",
  "router_agent",
  "ask_genome_agent",
]

[[tool.mypy.overrides]]
# Vendored upstream code, regenerated by scripts/sync_ask_genome_core.py and untyped upstream.
# Callers see it as Any; the adapter in front of it is what gets type-checked.
module = "ask_genome_agent.vendor.ask_genome_core.*"
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
# nltk ships no py.typed marker and has no maintained types-nltk stub package on PyPI.
module = "nltk.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scipy's stubs live in a separate package that does not cover scipy.stats.
module = "scipy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "unit: isolated unit tests",
  "integration: in-process component integration tests",
  "live: opt-in tests requiring enterprise gateway credentials",
  "mongo: opt-in tests that retain execution records in configured MongoDB",
]
asyncio_mode = "auto"
