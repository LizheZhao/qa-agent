name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked workspace
        run: uv sync --frozen --all-packages --dev
      - name: Install locked frontend
        working-directory: frontend
        run: npm ci
      - name: Check generated frontend API contract
        working-directory: frontend
        run: npm run check:api
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check --no-cache .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: Check runtime dependency projection
        run: uv run python scripts/generate_dependency_projections.py --check
      - name: Validate deployment
        run: uv run python scripts/validate_deployment.py
      - name: Validate Compose
        run: docker compose config --quiet
